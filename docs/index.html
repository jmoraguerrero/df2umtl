<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offer Concierge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone">
      <!-- Chat header -->
      <header class="chat-header">
        <button class="back-btn" aria-label="Back">&#8249;</button>
        <div class="avatar" id="agentAvatar">OC</div>
        <div class="header-info">
          <div class="header-name" id="agentName">Offer Concierge</div>
          <div class="header-status" id="agentStatus">online</div>
        </div>
        <div class="header-icons">
          <button
            class="voice-toggle"
            id="voiceToggle"
            aria-label="Toggle voice replies"
            title="Read replies aloud"
          >
            &#128263;
          </button>
        </div>
      </header>

      <!-- Messages -->
      <main class="chat-body" id="chatBody">
        <div class="date-pill">today</div>
        <div class="encryption-note">
          Messages are routed to Salesforce Agentforce. This is a demo.
        </div>
      </main>

      <!-- Composer -->
      <footer class="composer">
        <div class="composer-input">
          <span class="emoji" aria-hidden="true">&#128512;</span>
          <input
            type="text"
            id="messageInput"
            placeholder="Type a message"
            autocomplete="off"
          />
          <span class="clip" aria-hidden="true">&#128206;</span>
        </div>
        <button class="send-btn" id="actionBtn" aria-label="Send message">
          <svg
            class="icon icon-send"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="currentColor"
          >
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
          <svg
            class="icon icon-mic"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="currentColor"
          >
            <path
              d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"
            />
          </svg>
        </button>
      </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
